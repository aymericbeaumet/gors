[package]
name = "gors-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
description = "Runtime ABI for Rust code generated by gors"
homepage = "https://aymericbeaumet.github.io/gors/"
repository = "https://github.com/aymericbeaumet/gors/"

[lib]
name = "gors_runtime"
path = "src/lib.rs"

[dev-dependencies]
gors-runtime-abi = { path = "../gors-runtime-abi" }

[lints]
workspace = true
