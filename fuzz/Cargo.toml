[package]
name = "fuzz"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
gors = { path = "../gors", default-features = false }
libfuzzer-sys = { version = "0.4.13", optional = true }

# Property-based testing (stable Rust alternative to fuzzing for CI)
[dev-dependencies]
proptest = "1.11"

[features]
default = []
fuzzing = ["dep:libfuzzer-sys"]

[[bin]]
name = "scanner"
path = "fuzz_targets/scanner.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false

[[bin]]
name = "compiler"
path = "fuzz_targets/compiler.rs"
required-features = ["fuzzing"]
test = false
doc = false
bench = false
