[package]
name = "gors"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
autotests = false
license = "MIT"
description = "Experimental go toolchain written in rust (parser, compiler) "
homepage = "https://aymericbeaumet.github.io/gors/"
repository = "https://github.com/aymericbeaumet/gors/"

[lib]
name = "gors"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
test_integration_go_repositories = []
test_integration_go_spec = []
test_integration_go_stdlib = []
test_integration_go_programs = []

[[test]]
name = "test_integration_go_repositories"
path = "tests/test_integration_go_repositories.rs"
required-features = ["test_integration_go_repositories"]

[[test]]
name = "test_integration_go_spec"
path = "tests/test_integration_go_spec.rs"
required-features = ["test_integration_go_spec"]

[[test]]
name = "test_integration_go_stdlib"
path = "tests/test_integration_go_stdlib.rs"
required-features = ["test_integration_go_stdlib"]

[[test]]
name = "test_integration_go_programs"
path = "tests/test_integration_go_programs.rs"
required-features = ["test_integration_go_programs"]

[[test]]
name = "test_incremental_query_db"
path = "tests/test_incremental_query_db.rs"

[[test]]
name = "test_owned_syntax_invalidation"
path = "tests/test_owned_syntax_invalidation.rs"

[[test]]
name = "test_owned_semantic_dependencies"
path = "tests/test_owned_semantic_dependencies.rs"

[[test]]
name = "test_compiler_session"
path = "tests/test_compiler_session.rs"

[dependencies]
# Library dependencies
gors-runtime-abi = { path = "../gors-runtime-abi" }
log = { version = "0.4", features = ["release_max_level_warn"] }
num-bigint = "0.4"
num-traits = "0.2"
phf = { version = "0.13", features = ["macros"] }
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
salsa = { version = "=0.28.1", default-features = false, features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
sourcemap = "9"
syn = { version = "2.0", features = ["full"] }
unicode-general-category = "1.1"

sha2 = "0.11"

serde_json = "1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rayon = "1.12"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[build-dependencies]
dirs = "6"
flate2 = "1"
gors-runtime-abi = { path = "../gors-runtime-abi" }
reqwest = { version = "0.13", features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
flate2 = "1"
rayon = "1.12"
tar = "0.4"
tempfile = "3.27"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
