name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'mise.toml'
      - 'scripts/release*'
      - 'docs/releasing.md'
      - 'LICENSE'
      - 'gors/**'
      - 'gors-cli/**'
      - 'gors-runtime/**'
      - 'gors-runtime-abi/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.go-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4
      - name: Test release tooling
        run: mise run release:test
      - name: Validate release version and source
        id: version
        env:
          IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            version="$(mise run release:check-tag -- --version "$GITHUB_REF_NAME")"
          else
            version="$(mise run release:check-tag)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4
      - name: Configure native MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Configure Windows ARM64 C compiler
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          $clang = (Get-Command clang-cl.exe -ErrorAction Stop).Source
          "CC=$clang" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Cache pinned Go SDK
        uses: actions/cache@v4
        with:
          path: ~/.cargo/gors-cache
          key: gors-go-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.go-version') }}
      - name: Build and package native release
        run: mise run release:build -- --target "${{ matrix.target }}" --version "${{ needs.prepare.outputs.version }}"
      - name: Test extracted release archive
        run: mise run release:smoke -- --target "${{ matrix.target }}" --version "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.8.4
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify complete six-platform release
        run: mise run release:validate -- --version "$RELEASE_VERSION" --directory dist
      - uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: dist
      - name: Publish all validated assets together
        run: |
          prerelease=false
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then
            prerelease=true
          fi
          if gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft' > release-state; then
            if [ "$(cat release-state)" != true ]; then
              echo '::error::This release is already published; refusing to replace its assets'
              exit 1
            fi
          else
            gh release create "$RELEASE_VERSION" --verify-tag --draft --generate-notes --prerelease="$prerelease" --title "gors $RELEASE_VERSION"
          fi
          gh release upload "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_VERSION" --draft=false --prerelease="$prerelease"
