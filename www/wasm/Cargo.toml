[package]
name = "gors-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
description = "WebAssembly bindings for gors"
repository = "https://github.com/aymericbeaumet/gors/"
publish = false

[lib]
name = "gors"
path = "lib.rs"
crate-type = ["cdylib"]

[workspace]

[lints.clippy]
all = { level = "warn", priority = -1 }

[features]
default = []
threads = ["dep:rayon", "dep:wasm-bindgen-rayon", "gors/wasm-threads"]

[dependencies]
console_error_panic_hook = "0.1"
gors = { path = "../../gors", default-features = false }
rayon = { version = "1.12", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-rayon = { version = "1.3", optional = true }
