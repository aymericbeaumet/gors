[package]
name = "gors-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT"
description = "CLI for gors — Go toolchain written in Rust"

[[bin]]
name = "gors"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
gors = { path = "../gors" }
gors-runtime-abi = { path = "../gors-runtime-abi" }
atty = "0.2"
clap = { version = "4.6", features = ["derive"] }
pretty_env_logger = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
